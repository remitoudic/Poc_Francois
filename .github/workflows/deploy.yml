name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VM_hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy to Server via SSH (attempt 1)
        id: deploy_attempt_1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          timeout: 120s
          command_timeout: 15m
          envs: GITHUB_TOKEN
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
            git fetch origin
            git checkout -B main origin/main
            git reset --hard origin/main
            bash scripts/deploy.sh

      - name: Wait before SSH retry
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to Server via SSH (attempt 2)
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          timeout: 120s
          command_timeout: 15m
          envs: GITHUB_TOKEN
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
            git fetch origin
            git checkout -B main origin/main
            git reset --hard origin/main
            bash scripts/deploy.sh

      - name: Print diagnostics on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          timeout: 30s
          command_timeout: 2m
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            echo "=== docker compose ps ==="
            docker compose ps || true
            echo "=== api, worker and temporal logs (last 50 lines) ==="
            docker compose logs --tail 50 api worker temporal || true
            echo "=== frontend logs (last 50 lines) ==="
            docker compose logs --tail 50 frontend || true
